name: forge_cli
description: >-
  Code generator for Flutter projects following Clean Architecture
  (feature-first, repository pattern, use cases). Think `ng generate` /
  `nest generate` for Flutter: features, entities, models, data sources,
  repositories, use cases, blocs or Riverpod notifiers, screens and widgets,
  wired into DI and routing.
version: 0.1.0
repository: https://github.com/BaliakaIriana/forge_cli
publish_to: none

environment:
  sdk: ^3.5.0

executables:
  forge: forge

dependencies:
  args: ^2.7.0
  mason_logger: ^0.3.6
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
